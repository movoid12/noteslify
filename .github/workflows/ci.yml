name: CI Workflow - Lint, Format, and Security Checks
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm 📦
        with:
          version: 10
          run_install: false

      - name: Install Node.js 🌐
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies 📦
        run: pnpm install

      - name: Setup Biome CLI
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Check dependencies Security (high severity) 🔒
        run: pnpm audit --audit-level high

      - name: Run reviewdog with biome ✅
        uses: mongolyy/reviewdog-action-biome@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review

      - name: Run lint check and format check ✅
        run: biome ci

      - name: Run type check ✅
        run: pnpm typecheck
